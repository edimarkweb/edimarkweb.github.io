[package]
name = "edimarkweb"
version = "2.32.0"
description = "Editor Markdown con soporte LaTeX"
authors = ["Juan José de Haro <jjdeharo@gmail.com>"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "edimarkweb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# El corrector ortográfico de WebKitGTK se enciende desde el propio webview:
# hay que hablar con él en la misma versión que usa wry.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
