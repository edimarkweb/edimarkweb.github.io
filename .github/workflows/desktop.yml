name: Native application builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the installers (for example, v2.20.0)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # Not ubuntu-latest: the binary links against the glibc of the
            # machine that builds it, so 24.04 (glibc 2.39) would produce
            # packages that refuse to start on Debian 12 or Ubuntu 22.04.
            os: ubuntu-22.04
            artifact: edimarkweb-linux
            target: ''
            bundle_path: src-tauri/target/release/bundle/**
          - name: Windows
            os: windows-latest
            artifact: edimarkweb-windows
            target: ''
            bundle_path: src-tauri/target/release/bundle/**
          - name: macOS (Apple silicon)
            os: macos-latest
            artifact: edimarkweb-macos
            target: ''
            bundle_path: src-tauri/target/release/bundle/**
          # The macOS runners are Apple silicon, so the Intel disk image is
          # cross-compiled from the same machine instead of asking for a
          # retired Intel runner.
          - name: macOS (Intel)
            os: macos-latest
            artifact: edimarkweb-macos-intel
            target: x86_64-apple-darwin
            bundle_path: src-tauri/target/x86_64-apple-darwin/release/bundle/**
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Add the cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: npm run desktop:build ${{ matrix.target != '' && format('-- --target {0}', matrix.target) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  publish-release:
    name: Publish installers in GitHub Releases
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: edimarkweb-linux
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: edimarkweb-windows
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: edimarkweb-macos
          path: release-assets/macos
      - uses: actions/download-artifact@v4
        with:
          name: edimarkweb-macos-intel
          path: release-assets/macos-intel
      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          mapfile -t installers < <(find release-assets -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -print)
          if [[ ${#installers[@]} -eq 0 ]]; then
            echo "No installers were generated" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$RELEASE_TAG" "${installers[@]}" --repo "$GITHUB_REPOSITORY" --clobber
